name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel an in-flight release on main - it could be mid-tag/publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # Release depends on the tests, not just co-exists alongside them - nothing
  # ships if they don't pass.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases / upload assets
      id-token: write # required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StringWeaver/StringWeaver.csproj

      - name: Build
        run: dotnet build StringWeaver/StringWeaver.csproj --no-restore -c Release

      - name: Pack
        run: dotnet pack StringWeaver/StringWeaver.csproj --no-build -c Release -o artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      # Everything below only runs for pushes to main - other branches/PRs stop here.
      - name: Is main push?
        id: ismain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "yes=true" >> "$GITHUB_OUTPUT"

      # Directory.Build.props' CoreVersion is the single source of truth: it's
      # what the package is stamped with, and it's what the release tag tracks.
      - name: Read version
        id: ver
        if: steps.ismain.outputs.yes == 'true'
        shell: pwsh
        run: |
          [xml]$p = Get-Content Directory.Build.props
          $v = ($p.Project.PropertyGroup.CoreVersion | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw "No <CoreVersion> found in Directory.Build.props." }
          $v = "$v".Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v -> tag v$v"

      # A release is cut only when CoreVersion is bumped to something not yet tagged.
      # Pushes that don't change the version build + upload the artifact but skip
      # the release (re-tagging an existing version would clobber the release).
      - name: Check whether tag already exists
        id: tagcheck
        if: steps.ismain.outputs.yes == 'true'
        shell: pwsh
        run: |
          git fetch --tags --quiet
          $exists = (git tag --list "${{ steps.ver.outputs.tag }}")
          if ($exists) {
            Write-Host "Tag ${{ steps.ver.outputs.tag }} already exists - skipping release."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      # Exchanges GitHub's OIDC token for a short-lived (1h) nuget.org API key -
      # no long-lived secret to store or rotate.
      - name: NuGet login (OIDC -> temp API key)
        if: steps.ismain.outputs.yes == 'true' && steps.tagcheck.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

      - name: Push to NuGet
        if: steps.ismain.outputs.yes == 'true' && steps.tagcheck.outputs.exists == 'false'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Release
        if: steps.ismain.outputs.yes == 'true' && steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
